[project]
name = "logcat-ai-triage"
version = "0.1.0"
description = "Turns Android logcat into clustered, Jira-ready bug reports using embeddings, scikit-learn and a local LLM."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gabriel Nagawo", email = "gabrielnagawo12@gmail.com" }]
keywords = ["android", "logcat", "adb", "crash-triage", "llm", "ollama", "clustering", "qa"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "scikit-learn>=1.5",
    "typer>=0.12",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]

[project.scripts]
logcat-triage = "logcat_triage.cli:app"

[project.urls]
Repository = "https://github.com/Gabnagawo/logcat-ai-triage"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/logcat_triage"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs/results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PT", "RUF", "N", "PTH"]
# The formatter wraps code; the remaining long lines are regexes and log templates.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "-m",
    "not live",
    "--cov=logcat_triage",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=80",
]
markers = ["live: needs a running Ollama at OLLAMA_HOST (deselected by default)"]

[tool.coverage.run]
branch = true
source = ["logcat_triage"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "anthropic.*", "openai.*"]
ignore_missing_imports = true
